<!DOCTYPE html>
<html lang="it">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2F5D46">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanze">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Finanze Personali</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#EDEAE4;--panel:#FFFFFF;--panel2:#F5F3EE;--ink:#1C1E1A;--muted:#7C7F77;--line:#E7E3DB;
  --acc:#2F5D46;--acc-d:#1F3D2E;--acc2:#B9DC6E;--pos:#2E9E62;--neg:#D9534F;--warn:#E3A13A;--blue:#5B8DEF;--orange:#F08A4B;
  --r:22px;--shadow:0 1px 2px rgba(30,30,20,.04),0 10px 30px rgba(30,30,20,.05);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#121411;--panel:#1B1E1A;--panel2:#242822;--ink:#ECEDE7;--muted:#9A9E94;--line:#2D312B;--acc:#3F7A5C;--acc-d:#2A5440;--shadow:0 1px 2px rgba(0,0,0,.3)}
}
:root[data-theme="dark"]{--bg:#121411;--panel:#1B1E1A;--panel2:#242822;--ink:#ECEDE7;--muted:#9A9E94;--line:#2D312B;--acc:#3F7A5C;--acc-d:#2A5440;--shadow:0 1px 2px rgba(0,0,0,.3)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
.num{font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--acc)}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
/* sidebar */
.side{position:sticky;top:0;height:100vh;padding:22px 14px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.02em;padding:2px 10px 24px}
.logo{width:34px;height:34px;border-radius:11px;background:var(--acc);display:grid;place-items:center;color:var(--acc2);flex:none}
.nav{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:13px;color:var(--muted);font-weight:600;text-align:left;width:100%}
.nav:hover{color:var(--ink)}
.nav.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.nav .cnt{margin-left:auto;background:var(--warn);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px}
.side-foot{margin-top:auto;padding-top:16px}
.ucard{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--panel);box-shadow:var(--shadow)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--acc2);color:var(--acc-d);display:grid;place-items:center;font-weight:800;flex:none}
.ucard small{display:block;color:var(--muted);font-size:11px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--pos);margin-right:5px}
.dot.busy{background:var(--warn)}.dot.err{background:var(--neg)}.dot.demo{background:var(--blue)}
/* main */
main{padding:22px 28px 48px;min-width:0}
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.top .ttl{flex:1;min-width:200px}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:700}
.top h1{font-size:28px;font-weight:800;letter-spacing:-.025em;line-height:1.15}
.top .sub{color:var(--muted);font-size:13px;margin-top:2px}
.monthnav{display:flex;align-items:center;gap:2px;background:var(--panel);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.monthnav span{min-width:128px;text-align:center;font-weight:700;font-size:13px}
.iconbtn{width:34px;height:34px;border-radius:999px;display:grid;place-items:center;flex:none}
.iconbtn:hover{background:var(--panel2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:999px;font-weight:700;background:var(--panel);box-shadow:var(--shadow);white-space:nowrap;font-size:13.5px}
.btn:hover{filter:brightness(.97)}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.acc{background:var(--acc);color:#fff}
.btn.sm{padding:7px 13px;font-size:12.5px}
.btn.ghost{box-shadow:none;background:var(--panel2)}
.btn.danger{color:var(--neg)}
.btn:disabled{opacity:.5;cursor:default}
/* grid & cards */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.card{background:var(--panel);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);min-width:0;position:relative}
.c2{grid-column:span 2}.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c9{grid-column:span 9}.c12{grid-column:span 12}
.card h3{font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:14px}
.card h3 .sp{flex:1}
.card h3 small,.link{color:var(--muted);font-weight:600;font-size:12px}
.link{cursor:pointer}.link:hover{color:var(--ink)}
.lbl{color:var(--muted);font-size:12px;font-weight:600}
.big{font-size:28px;font-weight:800;letter-spacing:-.025em}
.muted{color:var(--muted)}
.pos{color:var(--pos)}.neg{color:var(--neg)}
.chip{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.chip.up{background:rgba(46,158,98,.13);color:var(--pos)}
.chip.dn{background:rgba(217,83,79,.12);color:var(--neg)}
.chip.neu{background:var(--panel2);color:var(--muted)}
.chip.warn{background:rgba(227,161,58,.16);color:#B97A14}
/* hero */
.hero{background:radial-gradient(120% 140% at 100% 0%,#4C7F5F 0%,var(--acc) 38%,var(--acc-d) 100%);color:#fff;overflow:hidden;min-height:230px;display:flex;flex-direction:column}
.hero .lbl{color:rgba(255,255,255,.7)}
.hero-val{font-size:40px;font-weight:800;letter-spacing:-.03em;margin:6px 0 8px}
.hero .chip.up{background:rgba(185,220,110,.22);color:var(--acc2)}
.hero .chip.dn{background:rgba(255,140,130,.2);color:#FFB3AC}
.hero-split{display:flex;gap:26px;margin-top:16px;flex-wrap:wrap}
.hero-split div{font-size:12px;color:rgba(255,255,255,.7)}
.hero-split b{display:block;color:#fff;font-size:15px;margin-top:2px}
.qa{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:18px;position:relative;z-index:2}
.qa button{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.13);color:#fff;padding:9px 14px;border-radius:999px;font-weight:700;font-size:12.5px;backdrop-filter:blur(4px)}
.qa button:first-child{background:#fff;color:var(--acc-d)}
.qa button:hover{background:rgba(255,255,255,.22)}.qa button:first-child:hover{background:#F2F2EA}
.cc{position:absolute;right:-30px;top:26px;width:250px;height:156px;border-radius:20px;background:linear-gradient(140deg,#F3EFE6,#D9D2C3);box-shadow:0 20px 40px rgba(0,0,0,.25);transform:rotate(-14deg);padding:18px;color:#5A574F;z-index:1}
.cc.b{right:30px;top:60px;background:linear-gradient(140deg,var(--acc2),#8DBB45);transform:rotate(-4deg);color:#28451F}
.cc .chipc{width:34px;height:26px;border-radius:6px;background:linear-gradient(135deg,#E7D9A8,#C7B46F);margin:18px 0 22px}
.cc .nm{font-weight:800;font-size:15px}.cc .no{font-size:12px;letter-spacing:.2em}
.cc .mc{position:absolute;right:16px;bottom:14px;display:flex}.cc .mc i{width:22px;height:22px;border-radius:50%;background:#E55B3C;display:block}.cc .mc i+i{background:#F2A93B;margin-left:-9px;opacity:.9}
/* kpi */
.kpi .kpi-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.kval{font-size:23px;font-weight:800;letter-spacing:-.02em;margin:8px 0 4px}
.spark{display:block;width:100%;height:34px}
/* lists */
.tx{display:grid;grid-template-columns:auto 40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 8px;border-radius:14px;cursor:pointer}
.tx.nochk{grid-template-columns:40px minmax(0,1fr) auto}
.tx:hover{background:var(--panel2)}
.ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:18px;flex:none}
.tx-d{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-s{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.amt{font-weight:800;text-align:right;white-space:nowrap}
.amt small{display:block;font-weight:600;color:var(--muted);font-size:11px}
.dayh{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:capitalize;padding:14px 8px 4px;display:flex;justify-content:space-between}
.chk input{width:17px;height:17px;accent-color:var(--acc);cursor:pointer}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--acc)}
.legend{display:flex;flex-direction:column;gap:9px}
.legend .li{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:10px;align-items:center;font-size:12.5px}
.legend .sw{width:10px;height:10px;border-radius:3px}
.legend .li span:nth-child(2){white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.legend .li .p{color:var(--muted);font-weight:700;min-width:38px;text-align:right}
.donut-wrap{position:relative;height:200px}
.donut-c{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.donut-c b{display:block;font-size:20px;font-weight:800}
.row{display:flex;align-items:center;gap:10px}
.row.sb{justify-content:space-between}
.stack>*+*{margin-top:12px}
.ins{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.4}
.ins:last-child{border:0}
.ins .e{width:32px;height:32px;border-radius:10px;background:var(--panel2);display:grid;place-items:center;flex:none}
.empty{color:var(--muted);text-align:center;padding:26px 10px;font-size:13px}
.callout{border-radius:16px;padding:14px 16px;font-weight:700;display:flex;gap:10px;align-items:center}
.callout.neg{background:rgba(217,83,79,.1);color:var(--neg)}
.callout.pos{background:rgba(46,158,98,.1);color:var(--pos)}
.callout.warn{background:rgba(227,161,58,.14);color:#B97A14}
/* gauge */
.gauge{width:100%;max-width:220px;display:block;margin:0 auto}
.gauge-v{text-align:center;margin-top:-46px}
.gauge-v b{font-size:26px;font-weight:800;display:block}
/* table */
.tw{overflow-x:auto;margin:0 -6px}
table.t{width:100%;border-collapse:collapse;font-size:13px}
.t th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:700;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap;text-transform:uppercase;letter-spacing:.04em}
.t td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:last-child td{border-bottom:0}
.t .r{text-align:right;white-space:nowrap}
.t tr.sub td{font-size:12.5px;color:var(--muted)}
.t tr.sub td:first-child{padding-left:34px}
.t tr.tot td{font-weight:800;border-top:2px solid var(--line)}
.t tr.click{cursor:pointer}.t tr.click:hover td{background:var(--panel2)}
.binp{width:96px;text-align:right;padding:6px 9px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);font-weight:700}
.binp:focus{outline:none;border-color:var(--acc)}
.heat td.h{text-align:right;font-variant-numeric:tabular-nums;font-size:12.5px}
/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.inp{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);outline:none;min-width:0}
.inp:focus{border-color:var(--acc)}
.filters .inp{width:auto;flex:1 1 150px;background:var(--panel);box-shadow:var(--shadow);border-color:transparent}
.filters .inp.q{flex:2 1 220px}
.bulk{position:sticky;top:8px;z-index:5;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:16px;margin-bottom:12px}
.bulk select{background:var(--bg);color:var(--ink);border:0;border-radius:10px;padding:7px 9px;max-width:230px}
.bulk .btn{box-shadow:none}
/* accounts */
.acct{cursor:pointer;display:flex;flex-direction:column;gap:6px;min-height:170px}
.acct .t1{display:flex;align-items:center;gap:10px}
.acct .bal{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:auto}
.acct.cardv{color:#fff;background:linear-gradient(135deg,var(--c1,#2F5D46),var(--c2,#1C2B22))}
.acct.cardv .muted,.acct.cardv .lbl{color:rgba(255,255,255,.72)}
.acct .ic{background:var(--panel2)}
.acct.cardv .ic{background:rgba(255,255,255,.16)}
.pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--panel2);color:var(--muted)}
.acct.cardv .pill{background:rgba(255,255,255,.16);color:#fff}
/* goals */
.ring{width:84px;height:84px;flex:none}
/* modal */
.modal,.confirm{position:fixed;inset:0;background:rgba(18,20,16,.45);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
.confirm{z-index:70}
.modal.on,.confirm.on{display:flex}
.sheet{background:var(--panel);border-radius:24px;width:min(580px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.25)}
.sheet.wide{width:min(980px,100%)}
.sheet header{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 10px}
.sheet header h2{font-size:18px;font-weight:800}
.sheet .body{overflow:auto;padding:6px 22px 18px;display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start}
.sheet footer{display:flex;gap:8px;align-items:center;padding:14px 22px;border-top:1px solid var(--line)}
.fld{grid-column:span 2;display:flex;flex-direction:column;gap:6px;min-width:0}
.fld.half{grid-column:span 1}
.fld>label{font-size:12px;font-weight:700;color:var(--muted)}
.fsec{grid-column:span 2;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--muted);padding-top:8px;border-top:1px dashed var(--line);margin-top:4px}
.fnote{font-size:12px;color:var(--muted);line-height:1.45}
.chkrow{display:flex;gap:8px;align-items:center;font-weight:600;cursor:pointer}
.chkrow input{width:17px;height:17px;accent-color:var(--acc)}
.seg{display:flex;background:var(--panel2);border-radius:13px;padding:3px;gap:2px}
.seg label{flex:1;text-align:center;padding:9px 6px;border-radius:10px;cursor:pointer;font-weight:700;font-size:13px;color:var(--muted)}
.seg input{display:none}
.seg label.on{background:var(--panel);box-shadow:var(--shadow);color:var(--ink)}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:90vw}
.toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
.toast.err{background:var(--neg);color:#fff}
.toast a{color:var(--acc2);margin-left:8px}
.loading{display:grid;place-items:center;height:70vh;color:var(--muted);gap:12px;text-align:center}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.dropz{border:2px dashed var(--line);border-radius:18px;padding:30px;text-align:center;cursor:pointer;display:block;transition:.2s}
.dropz:hover,.dropz.over{border-color:var(--acc);background:var(--panel2)}
.dropz input{display:none}
.steps{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.steps span{padding:6px 12px;border-radius:99px;background:var(--panel);font-weight:700;font-size:12px;color:var(--muted)}
.steps span.on{background:var(--ink);color:var(--bg)}
.mapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.alloc{display:flex;height:12px;border-radius:99px;overflow:hidden;gap:2px}
.alloc i{display:block;height:100%}
.bottomnav,.fab,.mtop{display:none}
body.noapp .side,body.noapp .bottomnav,body.noapp .fab,body.noapp .mtop{display:none !important}
body.noapp .app{grid-template-columns:1fr}
.connect{max-width:540px;margin:5vh auto 40px}
.connect .card{padding:26px}
.connect .stack>.fld{grid-column:auto}
.orline{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;font-weight:700;margin:18px 0}
.orline:before,.orline:after{content:"";flex:1;height:1px;background:var(--line)}
.qrbox{background:#fff;padding:14px;border-radius:16px;width:max-content;margin:6px auto 0}
.qrbox img,.qrbox canvas{display:block}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;word-break:break-all}
.cat-tree .ct{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:12px;cursor:pointer}
.cat-tree .ct:hover{background:var(--panel2)}
.cat-tree .ct.child{padding-left:42px;font-size:13px}
.sw2{width:12px;height:12px;border-radius:4px;flex:none}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--panel2);color:var(--muted)}
@media (max-width:1240px){
  .c3{grid-column:span 6}.c4,.c5{grid-column:span 6}.c7,.c8,.c9{grid-column:span 12}
  .grid>.kpi{grid-column:span 6}
}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  main{padding:12px 14px 104px}
  .grid{gap:12px}
  .grid>*{grid-column:span 12 !important}
  .grid>.kpi{grid-column:span 6 !important}
  .card{padding:16px;border-radius:20px}
  .top{margin-bottom:14px}
  .top h1{font-size:23px}
  .hide-m{display:none !important}
  .mtop{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-weight:800;font-size:16px}
  .mtop .sp{flex:1}
  .hero-val{font-size:32px}
  .cc{display:none}
  .kval{font-size:19px}
  .bottomnav{display:flex;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));background:var(--panel);border-radius:22px;box-shadow:0 10px 40px rgba(0,0,0,.15);padding:6px;z-index:40;justify-content:space-around}
  .bottomnav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:700;color:var(--muted);padding:6px 4px;border-radius:14px;flex:1}
  .bottomnav button.on{color:var(--ink);background:var(--panel2)}
  .fab{display:grid;place-items:center;position:fixed;right:18px;bottom:calc(86px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:18px;background:var(--ink);color:var(--bg);box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:41}
  .modal{padding:0;align-items:flex-end}
  .sheet{border-radius:24px 24px 0 0;max-height:94vh;width:100%}
  .sheet .body{grid-template-columns:1fr 1fr}
  .monthnav span{min-width:104px}
  .filters .inp{flex:1 1 45%}
  .tx{gap:10px;padding:8px 4px}
  .t th,.t td{padding:8px 6px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <main>
    <div class="mtop" id="mtop"></div>
    <div id="view"><div class="loading"><div><div class="spin"></div>Caricamento dati…</div></div></div>
  </main>

function parseNum(v,fmt='auto'){
  if(typeof v==='number')return isFinite(v)?v:null;
  let s=String(v??'').trim(); if(!s)return null;
  let neg=false;
  if(/^\(.*\)$/.test(s))neg=true;
  s=s.replace(/[^\d,.\-]/g,'');
  if(s.endsWith('-')){neg=!neg;s=s.slice(0,-1);}
  if(s.startsWith('-')){neg=!neg;s=s.slice(1);}
  if(!s)return null;
  if(fmt==='en')s=s.replace(/,/g,'');
  else if(fmt==='it')s=s.replace(/\./g,'').replace(',','.');
  else{
    const lc=s.lastIndexOf(','),ld=s.lastIndexOf('.');
    if(lc>ld)s=s.replace(/\./g,'').replace(',','.');
    else if(ld>lc){ if(lc>=0)s=s.replace(/,/g,''); else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,''); }
  }
  const n=parseFloat(s); return isNaN(n)?null:(neg?-n:n);
}
function parseDate(v){
  if(v instanceof Date&&!isNaN(v))return iso(new Date(v.getTime()+432e5));

  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/)))return m[1]+'-'+pad(m[2])+'-'+pad(m[3]);
  if((m=s.match(/^(\d{1,2})[\/\-\. ](\d{1,2})[\/\-\. ](\d{2,4})/))){let y=+m[3];if(y<100)y+=2000;const mo=+m[2],d=+m[1];if(mo<1||mo>12||d<1||d>31)return null;return y+'-'+pad(mo)+'-'+pad(d);}
  return null;
}

async function call(fn,...args){
  const m=MODE();
  if(m==='demo'||m==='none')return Local[fn](...args);

      .withSuccessHandler(r=>{try{res(JSON.parse(r));}catch(e){rej(new Error('Risposta non valida dal server'));}})
      .withFailureHandler(e=>rej(new Error(String(e&&e.message||e)))).api(payload));
  }else{
    let r;
    try{r=await fetch(CONN.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:payload,redirect:'follow',cache:'no-store'});}
    catch(e){throw new Error('Connessione non riuscita. Verifica la rete e che il deployment Apps Script abbia accesso "Chiunque".');}

  }

}

function portfolio(ops=S.db.Operazioni,uptoDate=null){
  const pos={};let realized=0,income=0,incomeY=0;const yr=CUR.slice(0,4);
  [...ops].filter(o=>!uptoDate||o.data<=uptoDate).sort((a,b)=>a.data<b.data?-1:1).forEach(o=>{
    const t=o.ticker;if(!t)return;const T=IX.tit?IX.tit[t]:null;const f=N(T&&T.fattore)||1;
    const p=pos[t]||(pos[t]={ticker:t,q:0,cost:0,realized:0,income:0,conto:o.contoId});
    const q=N(o.quantita),pr=N(o.prezzo),fee=N(o.commissioni)+N(o.tasse);
    if(o.tipo==='acquisto'){p.q+=q;p.cost+=q*pr*f+fee;}
    else if(o.tipo==='vendita'){const pmc=p.q?p.cost/p.q:0;const r=q*pr*f-fee-pmc*q;p.realized+=r;realized+=r;p.cost-=pmc*q;p.q-=q;if(Math.abs(p.q)<1e-9){p.q=0;p.cost=0;}}
    else{const g=(q||1)*pr-fee;p.income+=g;income+=g;if(o.data.slice(0,4)===yr)incomeY+=g;}
  });
  let value=0,cost=0;const byClass={},byConto={};
  const list=Object.values(pos).map(p=>{
    const T=(IX.tit||{})[p.ticker]||{};const f=N(T.fattore)||1;const fx=N(T.cambio)||1;
    const price=N(T.prezzo);const v=price?p.q*price*fx*f:p.cost;
    const o={...p,nome:T.nome||p.ticker,classe:T.classe||'Altro',price,fx,f,valuta:T.valuta||'EUR',agg:T.aggiornato||'',fonte:T.fonte||'',value:v,pmc:p.q?p.cost/p.q/f:0,pnl:v-p.cost,pnlPct:p.cost?(v-p.cost)/p.cost:0};
    if(p.q>0){value+=v;cost+=p.cost;byClass[o.classe]=(byClass[o.classe]||0)+v;byConto[p.conto]=(byConto[p.conto]||0)+v;}
    return o;
  });
  list.forEach(o=>o.weight=value?o.value/value:0);
  return{list:list.filter(o=>o.q>0).sort((a,b)=>b.value-a.value),closed:list.filter(o=>o.q<=0),value,cost,pnl:value-cost,pnlPct:cost?(value-cost)/cost:0,realized,income,incomeY,byClass,byConto};
}

async function syncCall(fn){S.pending++;paintSync();try{await fn();S.err=false;}catch(e){S.err=true;toast('Errore di sincronizzazione: '+(e.message||e),'err');}finally{S.pending--;paintSync();}}
async function persist(sheet,rows,opt={}){
  rows=[].concat(rows).filter(Boolean);if(!rows.length)return;
  const k=keyOf(sheet),arr=S.db[sheet],pos=new Map(arr.map((x,i)=>[String(x[k]),i]));
  rows.forEach(r=>{const i=pos.get(String(r[k]));if(i!==undefined)arr[i]=r;else{pos.set(String(r[k]),arr.length);arr.push(r);}});
  reindex();if(!opt.silent)render();
  await syncCall(async()=>{for(const c of chunks(rows,400))await call('saveRows',sheet,JSON.stringify(c));});
}
async function removeRows(sheet,keys,opt={}){
  keys=[].concat(keys).map(String);if(!keys.length)return;const ks=new Set(keys),k=keyOf(sheet);
  S.db[sheet]=S.db[sheet].filter(x=>!ks.has(String(x[k])));reindex();if(!opt.silent)render();
  await syncCall(()=>call('deleteRows',sheet,JSON.stringify(keys)));
}

function sparkSvg(vals,color){

function goalCur(g){return g.contoId&&IX.acc[g.contoId]?accBalance(IX.acc[g.contoId]):N(g.versato);}
function insights(ym){
  const out=[],A=agg(ym),prev=addMonths(ym,-1),P=agg(prev),isCur=ym===CUR;
  if(isCur){
    const day=+TODAY.slice(8,10);
    const pTo=sum(S.db.Movimenti.filter(m=>m.data.slice(0,7)===prev&&+m.data.slice(8,10)<=day&&kindOf(m)==='uscita'),m=>-N(m.importo));
    if(pTo>0){const d=(A.out-pTo)/pTo;out.push({ic:d<=0?'📉':'📈',t:`Spese ${d<=0?'inferiori':'superiori'} del ${Math.abs(Math.round(d*100))}% rispetto allo stesso periodo del mese scorso`,tone:d<=0?'pos':'neg'});}
    if(day>=5&&A.out>0)out.push({ic:'🔮',t:`Proiezione uscite a fine mese: <b>${E0(A.out/day*daysIn(ym))}</b>`});
  }else if(P.out>0){const d=(A.out-P.out)/P.out;out.push({ic:d<=0?'📉':'📈',t:`Spese ${d<=0?'inferiori':'superiori'} del ${Math.abs(Math.round(d*100))}% rispetto a ${MESI[+prev.slice(5)-1].toLowerCase()}`,tone:d<=0?'pos':'neg'});}
  const avg={};for(let k=1;k<=3;k++){const a=agg(addMonths(ym,-k));Object.entries(a.byRoot).forEach(([r,v])=>avg[r]=(avg[r]||0)+v/3);}
  let best=null;Object.entries(A.byRoot).forEach(([r,v])=>{if(r==='_nc'||!avg[r])return;const d=v-avg[r];if(d>40&&(!best||d>best.d))best={r,d};});
  if(best)out.push({ic:(cat(best.r)||{}).icona||'⚠️',t:`<b>${esc((cat(best.r)||{}).nome)}</b>: +${E0(best.d)} rispetto alla media degli ultimi 3 mesi`});
  if(A.unc)out.push({ic:'🏷️',t:`${A.unc} movimenti da categorizzare questo mese`,a:'filterUnc'});
  if(A.in>0){const sr=(A.in-A.out)/A.in;out.push({ic:'💡',t:`Tasso di risparmio del mese: <b>${Pc(sr,false)}</b>${sr>=.2?' — ottimo':sr<0?' — stai spendendo più di quanto incassi':''}`});}
  activeAcc().filter(a=>a.tipo==='carta_credito'&&N(a.plafond)>0).forEach(a=>{const u=-Math.min(0,IX.saldo[a.id]||0)/N(a.plafond);if(u>.7)out.push({ic:'💳',t:`${esc(a.nome)}: utilizzato il ${Math.round(u*100)}% del plafond`,tone:'neg'});});
  return out.slice(0,5);
}

/* ===================== MOVIMENTI ===================== */
function filteredMov(){
  const f=S.f,q=f.q.trim().toLowerCase();let from='',to='9999';
  if(f.periodo==='mese'){from=S.month+'-01';to=S.month+'-31';}
  else if(f.periodo==='3m'){from=addMonths(S.month,-2)+'-01';to=S.month+'-31';}
  else if(f.periodo==='anno'){from=S.month.slice(0,4)+'-01-01';to=S.month.slice(0,4)+'-12-31';}
  return S.db.Movimenti.filter(m=>{
    if(m.data<from||m.data>to)return false;
    if(f.conto&&m.contoId!==f.conto)return false;
    if(f.cat==='_nc'){if(m.trasferimentoId||IX.cat[m.categoriaId])return false;}

    return true;
  }).sort((a,b)=>a.data<b.data?1:a.data>b.data?-1:(a.creato<b.creato?1:-1));
}

function saveMov(d,orig){
  const imp=Math.abs(N(d.importo));if(!imp)return'Inserisci un importo';
  const pair=orig&&orig.trasferimentoId?S.db.Movimenti.filter(x=>x.trasferimentoId===orig.trasferimentoId):[];
  if(d.tipo==='giroconto'){
    if(!d.contoId||!d.contoDest||d.contoId===d.contoDest)return'Seleziona due conti diversi';
    const tid=(orig&&orig.trasferimentoId)||uid();
    const o=pair.find(x=>N(x.importo)<0)||{id:orig&&!orig.trasferimentoId?orig.id:uid(),creato:stamp(),hash:'',origine:'manuale'};
    const i=pair.find(x=>N(x.importo)>=0&&x.id!==o.id)||{id:uid(),creato:stamp(),hash:'',origine:'manuale'};
    const base={data:d.data,categoriaId:'giroconto',note:d.note||'',tag:d.tag||'',trasferimentoId:tid};
    persist('Movimenti',[{...o,...base,contoId:d.contoId,importo:-imp,descrizione:d.descrizione||'Giroconto verso '+accName(d.contoDest)},{...i,...base,contoId:d.contoDest,importo:imp,descrizione:d.descrizione||'Giroconto da '+accName(d.contoId)}]);
  }else{
    if(!d.contoId)return'Seleziona un conto';
    const keep=orig&&!orig.trasferimentoId?orig:{id:uid(),creato:stamp(),hash:'',origine:'manuale'};
    const extra=pair.filter(x=>x.id!==keep.id).map(x=>x.id);
    if(extra.length)removeRows('Movimenti',extra,{silent:true});
    persist('Movimenti',{...keep,data:d.data,contoId:d.contoId,importo:d.tipo==='uscita'?-imp:imp,categoriaId:d.categoriaId||'',descrizione:d.descrizione||'',note:d.note||'',tag:d.tag||'',trasferimentoId:''});
  }
}

V.budget=()=>{
  const ym=S.month,BT=budgetTot(ym),A=agg(ym),isCur=ym===CUR,day=+TODAY.slice(8,10);

  const pm=agg(addMonths(ym,-1));
  const unb=sum(BT.rows.filter(r=>!r.b),r=>r.s)+(A.byRoot._nc||0);
  const scope=S.budgetScope;
  const row=(c,b,s,src,isSub,avg,prev)=>{
    const p=b?s/b:0,diff=b-s;
    return`<tr class="${isSub?'sub':''}"><td>${isSub?'':`<span style="margin-right:8px">${c.icona||'•'}</span>`}<b style="${isSub?'font-weight:600':''}">${esc(c.nome)}</b>${src==='m'?' <span class="tag">solo questo mese</span>':''}</td>
      <td class="r"><input class="binp num" data-bud="${c.id}" value="${b?String(r2(b)).replace('.',','):''}" placeholder="—" inputmode="decimal"></td>
      <td class="r num">${E(s)}</td>
      <td class="r num ${b?diff<0?'neg':'pos':''}">${b?(diff>=0?'':'−')+E(Math.abs(diff)).replace('-',''):'—'}</td>
      <td style="min-width:130px">${b?`<div class="row"><div class="bar" style="flex:1;position:relative"><i style="width:${Math.min(100,p*100)}%;background:${statusColor(p)}"></i>${prog>0&&prog<1?`<span style="position:absolute;left:${prog*100}%;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.35"></span>`:''}</div><span class="num" style="font-size:12px;font-weight:700;min-width:38px;text-align:right">${Math.round(p*100)}%</span></div>`:''}</td>
      <td class="r num muted hide-m">${E0(prev)}</td><td class="r num muted hide-m">${E0(avg)}</td></tr>`;
  };
  const rows=BT.rows.filter(r=>r.b||r.s||r.kids.some(k=>k.b||k.s)).sort((a,b)=>(b.b||0)-(a.b||0)||b.s-a.s);
  const others=BT.rows.filter(r=>!rows.includes(r));
  S.post.push(()=>{
    const rr=BT.rows.filter(r=>r.b>0).sort((a,b)=>b.b-a.b);
    if(rr.length)mkChart('chBud',{type:'bar',data:{labels:rr.map(r=>r.cat.nome),datasets:[{label:'Budget',data:rr.map(r=>r2(r.b)),backgroundColor:alpha(cssv('--acc'),.18),borderRadius:6,barPercentage:.9,categoryPercentage:.7},{label:'Speso',data:rr.map(r=>r2(r.s)),backgroundColor:rr.map(r=>r.s>r.b?cssv('--neg'):cssv('--acc')),borderRadius:6,barPercentage:.9,categoryPercentage:.7}]},options:{...baseOpts({legend:true}),indexAxis:'y',scales:{x:{grid:{color:cssv('--line')},ticks:{color:cssv('--muted'),callback:v=>kfmt(v)},border:{display:false}},y:{grid:{display:false},ticks:{color:cssv('--ink'),font:{weight:'600'}},border:{display:false}}}}});
    const yr=ym.slice(0,4),lb=[],bb=[],ss=[];

  });

    <div class="card kpi c3"><span class="lbl">Da inizio anno (${yr})</span><div class="kval num">${E0(ys)} <span class="muted" style="font-size:14px">/ ${E0(yb)}</span></div>${deltaChip(yb?(ys-yb)/yb:null,true)}</div>
    ${BT.over.length?`<div class="c12 callout neg">⚠️ Fuori budget: ${BT.over.map(r=>`${r.cat.icona||''} ${esc(r.cat.nome)} (+${E0(r.s-r.b)})`).join(' · ')}</div>`:''}
    ${isCur&&BT.b&&A.out/day*daysIn(ym)>BT.b?`<div class="c12 callout warn">🔮 Al ritmo attuale chiuderai il mese con ${E0(A.out/day*daysIn(ym))} di uscite totali contro un budget di ${E0(BT.b)}.</div>`:''}
  </div>
  <div class="grid">
    <div class="card c7"><h3>Budget vs speso<span class="sp"></span><small>${ymLabel(ym)}</small></h3><div style="height:${Math.max(220,BT.rows.filter(r=>r.b>0).length*44)}px">${BT.rows.some(r=>r.b>0)?'<canvas id="chBud"></canvas>':noData('Imposta un budget nella tabella qui sotto')}</div></div>

    <div class="card c12"><h3>Dettaglio per categoria<span class="sp"></span>
      <div class="seg" style="width:auto;font-size:12px">${[['default','Modifica budget standard'],['mese','Solo '+ymLabel(ym)]].map(([k,l])=>`<label class="${scope===k?'on':''}" data-a="budScope" data-v="${k}" style="padding:6px 12px">${l}</label>`).join('')}</div></h3>

function processRicorrenze(){
  const out=[],upd=[];
  S.db.Ricorrenze.forEach(r=>{

  if(out.length){persist('Movimenti',out,{silent:true});persist('Ricorrenze',upd,{silent:true});toast(`${out.length} movimenti ricorrenti registrati automaticamente`);}
}

function parseCSV(txt){
  txt=txt.replace(/^\uFEFF/,'');
  const lines=txt.split(/\r?\n/).filter(l=>l.trim()).slice(0,30);
  const cnt=(l,c)=>{let n=0,q=false;for(const ch of l){if(ch==='"')q=!q;else if(ch===c&&!q)n++;}return n;};
  const seps=[';',',','\t','|'];let sep=';',best=-1;
  seps.forEach(s=>{const c=lines.map(l=>cnt(l,s));const mode=c.sort((a,b)=>c.filter(x=>x===b).length-c.filter(x=>x===a).length)[0]||0;const score=mode*lines.filter(l=>cnt(l,s)===mode).length;if(score>best){best=score;sep=s;}});
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<txt.length;i++){const ch=txt[i];
    if(q){if(ch==='"'){if(txt[i+1]==='"'){f+='"';i++;}else q=false;}else f+=ch;}
    else if(ch==='"')q=true;else if(ch===sep){row.push(f);f='';}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&txt[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f='';}
    else f+=ch;}
  if(f||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
async function readImportFile(file){
  const ext=file.name.split('.').pop().toLowerCase();
  if(['xlsx','xls','ods','xlsm'].includes(ext)){
    if(!window.XLSX)throw new Error('Libreria Excel non caricata: controlla la connessione');
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});
    const ws=wb.Sheets[wb.SheetNames[0]];
    return XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''}).filter(r=>r.some(c=>String(c).trim()!==''));
  }
  const buf=await file.arrayBuffer();let txt=new TextDecoder('utf-8').decode(buf);
  if(txt.includes('\uFFFD'))txt=new TextDecoder('windows-1252').decode(buf);
  if(/<table/i.test(txt)&&window.XLSX){const wb=XLSX.read(txt,{type:'string',cellDates:true});return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:''});}
  return parseCSV(txt);
}
function guessHeader(rows){for(let i=0;i<Math.min(rows.length,40);i++){const r=rows[i].map(x=>String(x).toLowerCase());if(r.some(c=>/data|date/.test(c))&&r.some(c=>/importo|dare|avere|addebit|accredit|uscit|entrat|amount|movimento/.test(c)))return i;}return 0;}
function guessMap(hdr){
  const h=hdr.map(x=>String(x).toLowerCase().trim());const find=(...res)=>{for(const re of res){const i=h.findIndex(c=>re.test(c));if(i>=0)return i;}return -1;};
  const m={data:find(/data\s*(contab|oper|registr|movim)/,/^data$/,/^data/,/date/),desc:find(/descrizione\s*(estesa|completa|operazione)/,/descri/,/causale|dettagl|operazione|beneficiario|esercente|merchant/),desc2:-1,importo:find(/^importo/,/importo/,/amount|ammontare|^euro|valore/),dare:find(/^dare|addebit|uscit/),avere:find(/^avere|accredit|entrat/),cat:find(/categor/)};
  if(m.dare>=0||m.avere>=0)m.importo=-1;
  const c=find(/^causale/);if(c>=0&&c!==m.desc)m.desc2=c;
  return m;
}
function ruleMatch(desc){
  const d=String(desc||'').toLowerCase();
  const rs=[...S.db.Regole].sort((a,b)=>N(b.priorita)-N(a.priorita));
  for(const r of rs){const ps=String(r.pattern||'').toLowerCase().split('|').map(s=>s.trim()).filter(Boolean);if(ps.some(p=>d.includes(p))&&IX.cat[r.categoriaId])return r.categoriaId;}
  return '';
}
function learnMap(){const m={};S.db.Movimenti.forEach(x=>{if(x.trasferimentoId||!IX.cat[x.categoriaId])return;const k=learnKey(x.descrizione)+'|'+(N(x.importo)>=0?'+':'-');if(!k.startsWith('|')){(m[k]=m[k]||{})[x.categoriaId]=(m[k][x.categoriaId]||0)+1;const k1='1:'+k.split(' ')[0].split('|')[0]+'|'+(N(x.importo)>=0?'+':'-');(m[k1]=m[k1]||{})[x.categoriaId]=(m[k1][x.categoriaId]||0)+1;}});const out={};Object.entries(m).forEach(([k,v])=>out[k]=Object.entries(v).sort((a,b)=>b[1]-a[1])[0][0]);return out;}
function guessCat(desc,imp,L){const r=ruleMatch(desc);if(r)return{c:r,s:'regola'};const sg='|'+(imp>=0?'+':'-');const k=learnKey(desc);if(L[k+sg])return{c:L[k+sg],s:'storico'};const k1=k.split(' ')[0];if(k1&&L['1:'+k1+sg])return{c:L['1:'+k1+sg],s:'storico'};return{c:'',s:''};}
function hashMovs(list){const occ={};return list.map(m=>{const b=[m.contoId,m.data,N(m.importo).toFixed(2),normDesc(m.descrizione)].join('|');occ[b]=(occ[b]||0)+1;return hashStr(b+'#'+occ[b]);});}
function analyzeImport(){
  const I=S.imp,mp=I.map;const rows=I.rows.slice(I.headerRow+1);const L=learnMap();
  const exist=S.db.Movimenti.filter(m=>m.contoId===I.contoId);const eh=hashMovs(exist);const ex=new Set([...eh,...exist.map(m=>m.hash).filter(Boolean)]);
  const out=[];
  rows.forEach(r=>{
    const data=parseDate(r[mp.data]);if(!data)return;
    let imp;if(mp.importo>=0)imp=parseNum(r[mp.importo],I.numFmt);else{const dd=mp.dare>=0?parseNum(r[mp.dare],I.numFmt):null,aa=mp.avere>=0?parseNum(r[mp.avere],I.numFmt):null;imp=(aa?Math.abs(aa):0)-(dd?Math.abs(dd):0);}
    if(imp==null||imp===0)return;if(I.inverti)imp=-imp;
    const desc=[mp.desc>=0?r[mp.desc]:'',mp.desc2>=0?r[mp.desc2]:''].map(x=>String(x||'').trim()).filter(Boolean).join(' — ').replace(/\s+/g,' ');
    out.push({data,importo:r2(imp),descrizione:desc,contoId:I.contoId});
  });
  const hs=hashMovs(out);
  out.forEach((m,i)=>{m.hash=hs[i];m.dup=ex.has(m.hash);m.sel=!m.dup;const g=guessCat(m.descrizione,m.importo,L);m.categoriaId=g.c;m.src=g.s;});
  I.preview=out.sort((a,b)=>a.data<b.data?1:-1);I.step=3;
}

/* ===================== export / download ===================== */
const csvCell=v=>{const s=String(v??'');return/[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
const csvNum=v=>String(r2(v)).replace('.',',');
async function download(name,content,mime){
  if(isGAS){try{const r=await call('exportFile',name,content,mime);toast('File salvato su Google Drive: '+r.name,'',r.url);}catch(e){toast('Errore export: '+e.message,'err');}return;}
  const b=new Blob(['\uFEFF'+content],{type:mime});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}

/* ---------- eventi globali ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const stop=e.target.closest('[data-stop]');if(stop&&el.contains(stop)&&stop!==el)return;
  const inner=e.target.closest('[data-a]');
  const fn=ACT[inner.dataset.a];if(fn){fn(inner.dataset,inner,e);}
});
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();document.getElementById('confirm').classList.remove('on');}});
let fT;
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.f!==undefined){S.f[t.dataset.f]=t.value;S.page=1;S.sel.clear();clearTimeout(fT);fT=setTimeout(render,t.tagName==='INPUT'?220:0);}});
document.addEventListener('change',async e=>{
  const t=e.target,ds=t.dataset;
  if(ds.sel){if(t.checked)S.sel.add(ds.sel);else S.sel.delete(ds.sel);render();return;}
  if(ds.bud){saveBudget(ds.bud,t.value);return;}
  if(ds.set){setSetting(ds.set,t.value);return;}
  if(ds.a2==='repYear'){S.reportYear=t.value;render();return;}
  if(ds.imp!==undefined&&S.imp){const k=ds.imp;if(k==='headerRow'){S.imp.headerRow=Math.max(0,(+t.value||1)-1);S.imp.map=guessMap(S.imp.rows[S.imp.headerRow]||[]);}else if(k==='inverti')S.imp.inverti=t.checked;else if(k==='numFmt')S.imp.numFmt=t.value;else S.imp.map[k]=+t.value;render();return;}
  if(ds.ir!==undefined&&S.imp){if(ds.ir==='all')S.imp.preview.forEach(m=>m.sel=t.checked);else S.imp.preview[+ds.ir].sel=t.checked;render();return;}
  if(ds.irc!==undefined&&S.imp){S.imp.preview[+ds.irc].categoriaId=t.value;S.imp.preview[+ds.irc].src='';return;}
  if(t.id==='impFile'&&t.files[0]){handleImportFile(t.files[0]);return;}
  if(t.id==='impConto'){S.impConto=t.value;return;}
  if(t.id==='impProf'){S.impProf=t.value;return;}
  if(t.id==='restoreFile'&&t.files[0]){
    try{const txt=await t.files[0].text();const d=JSON.parse(txt);if(!d.Movimenti||!d.Conti)throw new Error('File non valido');if(!await askConfirm(`Ripristinare il backup? Tutti i dati attuali saranno sostituiti (${d.Movimenti.length} movimenti, ${d.Conti.length} conti).`,'Ripristina'))return;await call('restoreBackup',JSON.stringify(d));await boot();toast('Backup ripristinato');}catch(err){toast('Errore ripristino: '+err.message,'err');}
  }
});
document.addEventListener('dragover',e=>{const z=e.target.closest&&e.target.closest('#dropz');if(z){e.preventDefault();z.classList.add('over');}});
document.addEventListener('dragleave',e=>{const z=e.target.closest&&e.target.closest('#dropz');if(z)z.classList.remove('over');});
document.addEventListener('drop',e=>{const z=e.target.closest&&e.target.closest('#dropz');if(z){e.preventDefault();z.classList.remove('over');if(e.dataTransfer.files[0])handleImportFile(e.dataTransfer.files[0]);}});

function parseHashConn(){

  linkDevice:openLinkDevice,
  copyLink:async()=>{try{await navigator.clipboard.writeText(deviceLink());toast('Link copiato');}catch(e){toast('Copia non riuscita','err');}},
  reload:async()=>{await reloadData(true);}
});
async function reloadData(manual){
  if(!S.db||MODE()==='demo'||S.pending)return;
  try{const raw=await call('loadAll');if(S.pending)return;S.db=normalize(raw);S.meta=Object.assign(S.meta,raw._meta||{});S.loadedAt=Date.now();reindex();render();if(manual)toast('Dati aggiornati');}
  catch(e){if(e.auth)return showConnect('Il token non è più valido.');if(manual)toast(e.message,'err');}
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible'||!S.db)return;
  if(document.getElementById('modal').classList.contains('on')||S.imp)return;
  if(Date.now()-(S.loadedAt||0)<90000)return;
  reloadData(false);
});

/* ---------- avvio ---------- */
async function boot(){
  try{const th=localStorage.getItem('fin_theme');if(th)document.documentElement.dataset.theme=th;}catch(e){}
  if(window.Chart){Chart.defaults.font.family="'Plus Jakarta Sans',system-ui,sans-serif";Chart.defaults.font.size=11.5;}
  parseHashConn();
  const m=MODE();
  if(m==='none'||(m==='gas'&&!(CONN&&CONN.token)))return showConnect();
  document.body.classList.add('noapp');
  document.getElementById('view').innerHTML='<div class="loading"><div><div class="spin"></div>Caricamento dati…</div></div>';
  try{
    const raw=await call('loadAll');
    S.meta=raw._meta||{};S.meta.mode=m;if(m==='demo')S.meta.demo=true;
    S.db=normalize(raw);S.loadedAt=Date.now();reindex();
    document.body.classList.remove('noapp');
    processRicorrenze();render();
  }catch(e){
    if(e.auth)return showConnect(e.message);
    document.getElementById('view').innerHTML=`<div class="loading"><div><b>Impossibile caricare i dati</b><br><span class="muted">${esc(e.message||e)}</span><br><br><div class="row" style="gap:8px;justify-content:center;flex-wrap:wrap"><button class="btn" onclick="boot()">Riprova</button><button class="btn ghost" data-a="disconnect" data-v="nodemo">Cambia collegamento</button></div></div></div>`;
  }
}
let rT;window.addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(()=>{if(S.db&&S.charts.length)render();},250);});
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost')&&!isGAS){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
boot();
</script>
</body>
